<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crypto Copilot</title>
  <style>
    *{box-sizing:border-box}
    body{margin:0;width:360px;background:#07090f;color:#f7f8fc;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}
    .wrap{padding:18px}
    .brand{display:flex;align-items:center;justify-content:space-between}
    .name{font-size:16px;font-weight:800}
    .sub{margin-top:3px;color:#7f899b;font-size:11px}
    .version{padding:6px 8px;border:1px solid rgba(255,255,255,.08);border-radius:9px;color:#687285;font-size:10px}
    .status{margin-top:16px;padding:12px;border-radius:12px;background:rgba(255,255,255,.04);color:#aeb7c5;font-size:12px;line-height:1.5}
    .status.ok{color:#76e3a8;background:rgba(66,214,132,.08)}
    .status.bad{color:#ff8997;background:rgba(255,75,100,.08)}
    .tools{margin-top:14px;color:#80899a;font-size:11px;line-height:1.6}
    button{width:100%;height:40px;margin-top:12px;border:0;border-radius:12px;background:linear-gradient(135deg,#697aff,#9a6cff);color:#fff;font-weight:800;cursor:pointer}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand">
      <div>
        <div class="name">Crypto Copilot</div>
        <div class="sub">No API key</div>
      </div>
      <div class="version">V2.2.6</div>
    </div>
    <div id="status" class="status">Checking central AI…</div>
    <div class="tools">Smart Reply · Opportunity · Quote · Translate · Rewrite · Thread · Trend Radar</div>
    <button id="recheck" type="button">Recheck API</button>
  </div>
  <script src="popup.js"></script>
</body>
</html>
