<!doctype html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">
  <title>Crypto Copilot</title>
  <style>
    *{box-sizing:border-box}body{margin:0;width:360px;min-height:420px;background:#0a0d12;color:#f5f7fb;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif}.wrap{padding:18px}.brand{display:flex;align-items:center;gap:11px}.logo{width:38px;height:38px;border-radius:12px;display:grid;place-items:center;background:linear-gradient(135deg,#6878ff,#9b6dff);box-shadow:0 10px 28px rgba(104,120,255,.28);font-size:19px}.name{font-size:16px;font-weight:800}.sub{margin-top:2px;color:#7f899a;font-size:11px}.card{margin-top:18px;padding:15px;border:1px solid rgba(255,255,255,.09);border-radius:17px;background:linear-gradient(145deg,rgba(255,255,255,.055),rgba(255,255,255,.025))}.label{font-size:11px;font-weight:700;color:#aeb6c5;margin-bottom:8px}.input-wrap{position:relative}.input{width:100%;height:42px;padding:0 42px 0 12px;border:1px solid rgba(255,255,255,.1);border-radius:11px;background:#070a0f;color:#fff;outline:none}.input:focus{border-color:#6878ff;box-shadow:0 0 0 3px rgba(104,120,255,.12)}.eye{position:absolute;right:7px;top:7px;width:28px;height:28px;border:0;border-radius:8px;background:transparent;color:#7f899a;cursor:pointer}.save{width:100%;height:40px;margin-top:10px;border:0;border-radius:11px;background:linear-gradient(135deg,#6878ff,#986dff);color:white;font-weight:750;cursor:pointer}.save:hover{filter:brightness(1.08)}.status{margin-top:11px;padding:9px 10px;border-radius:10px;background:rgba(255,255,255,.035);color:#8791a3;font-size:11px}.status.ok{color:#76e0a5;background:rgba(70,210,130,.08)}.status.bad{color:#ff8e9a;background:rgba(255,80,100,.08)}.divider{height:1px;background:rgba(255,255,255,.07);margin:18px 0}.tools{display:grid;grid-template-columns:1fr 1fr;gap:8px}.tool{padding:11px;border-radius:12px;background:rgba(255,255,255,.035);border:1px solid rgba(255,255,255,.06);color:#dfe4ed;font-size:11px}.tool b{display:block;font-size:14px;margin-bottom:3px}.foot{margin-top:16px;text-align:center;color:#586274;font-size:10px}
  </style>
</head>
<body>
  <div class="wrap">
    <div class="brand"><div class="logo">✦</div><div><div class="name">Crypto Copilot</div><div class="sub">Premium AI for Crypto Twitter</div></div></div>
    <div class="card">
      <div class="label">OPENROUTER API KEY</div>
      <div class="input-wrap"><input id="apiKey" class="input" type="password" placeholder="sk-or-v1-••••••••" autocomplete="off"><button id="toggle" class="eye" type="button">◉</button></div>
      <button id="save" class="save" type="button">Save API Key</button>
      <div id="status" class="status">Checking connection…</div>
    </div>
    <div class="divider"></div>
    <div class="tools"><div class="tool"><b>⚡ Smart Reply</b>3 reply styles</div><div class="tool"><b>🌍 Translate</b>Natural Persian</div><div class="tool"><b>✎ Rewrite</b>Sharper posts</div><div class="tool"><b>🧵 Thread</b>Build a thread</div></div>
    <div class="foot">API key is stored locally in this browser.</div>
  </div>
  <script src="popup.js"></script>
</body>
</html>
