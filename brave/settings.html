<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

  <meta charset="UTF-8">

  <meta
    name="viewport"
    content="width=device-width, initial-scale=1.0"
  >

  <title>
    Crypto Copilot Settings
  </title>

  <link
    rel="stylesheet"
    href="style.css"
  >

</head>

<body class="settings-page">

  <main class="settings-card">

    <div class="settings-icon">
      🤖
    </div>

    <h1>
      Crypto Copilot
    </h1>

    <p class="settings-subtitle">
      تنظیمات دستیار هوش مصنوعی
    </p>

    <label for="apiKey">
      OpenRouter API Key
    </label>

    <input
      id="apiKey"
      type="password"
      placeholder="sk-or-v1-..."
      autocomplete="off"
      spellcheck="false"
    >

    <p class="help-text">
      کلید شما فقط به صورت محلی در مرورگر
      ذخیره می‌شود و برای درخواست‌های AI
      استفاده خواهد شد.
    </p>

    <label for="model">
      مدل هوش مصنوعی
    </label>

    <input
      id="model"
      type="text"
      value="openrouter/auto"
      placeholder="openrouter/auto"
      autocomplete="off"
      spellcheck="false"
    >

    <button
      id="saveBtn"
      type="button"
    >
      ذخیره تنظیمات
    </button>

    <button
      id="clearBtn"
      type="button"
    >
      حذف API Key
    </button>

    <div id="status"></div>

    <hr>

    <p class="version">
      Crypto Copilot · Brave · v1.0.0
    </p>

  </main>

  <script src="settings.js"></script>

</body>

</html>
